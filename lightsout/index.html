<html>
	<head>
		<meta charset="UTF-8">
		<meta name="robots"content="noindex">
		
		<style>
			.box{
				box-sizing:border-box;
				width:110px;
				height:110px;
				float:left;
				margin-left:10px;
				margin-bottom:10px;
				background-image:url(長毛猫.png);
				background-size:cover;
				}
		</style>		
				
	</head>

	<body>
		<div style="text-align:center;font-size:32px;font-weight:bold;color:#ff5900">
			Lights Out
		</div>
		
		<div style="text-align:center;font-size:16px;">
			～すべてのねこちゃんをサマーカットにしよう🌟～
		</div>
		
		<br>
			
		<div style="width:600px; height:600px;margin:0 auto;">
			<div id="b00"class="box"onclick="reverse(0,0)"></div>
			<div id="b01"class="box"onclick="reverse(0,1)"></div>
			<div id="b02"class="box"onclick="reverse(0,2)"></div>
			<div id="b03"class="box"onclick="reverse(0,3)"></div>
			<div id="b04"class="box"onclick="reverse(0,4)"></div>
			<div id="b10"class="box"onclick="reverse(1,0)"></div>
			<div id="b11"class="box"onclick="reverse(1,1);" style="background-image:url(サマーカット.png);"></div>
			<div id="b12"class="box"onclick="reverse(1,2)"></div>
			<div id="b13"class="box"onclick="reverse(1,3);" style="background-image:url(サマーカット.png);"></div>
			<div id="b14"class="box"onclick="reverse(1,4)"></div>
			<div id="b20"class="box"onclick="reverse(2,0)"></div>
			<div id="b21"class="box"onclick="reverse(2,1)"></div>
			<div id="b22"class="box"onclick="reverse(2,2)"></div>
			<div id="b23"class="box"onclick="reverse(2,3)"></div>
			<div id="b24"class="box"onclick="reverse(2,4)"></div>
			<div id="b30"class="box"onclick="reverse(3,0)"></div>
			<div id="b31"class="box"onclick="reverse(3,1);" style="background-image:url(サマーカット.png);"></div>
			<div id="b32"class="box"onclick="reverse(3,2)"></div>
			<div id="b33"class="box"onclick="reverse(3,3);" style="background-image:url(サマーカット.png);"></div>
			<div id="b34"class="box"onclick="reverse(3,4)"></div>
			<div id="b40"class="box"onclick="reverse(4,0)"></div>
			<div id="b41"class="box"onclick="reverse(4,1)"></div>
			<div id="b42"class="box"onclick="reverse(4,2)"></div>
			<div id="b43"class="box"onclick="reverse(4,3)"></div>
			<div id="b44"class="box"onclick="reverse(4,4)"></div>
			
		</div>
		
		<script>
			function reverse(y,x){
				clk(y,x);     // クリックしたマス
				clk(y-1,x);   // 上
				clk(y+1,x);   // 下
				clk(y,x-1);   // 左
				clk(y,x+1);   // 右
			}
			
			function clk(y,x){
				var id="b"+ y + x;
				
				//yとxが０～４の場合のみ、画像を変更する
				if(y>=0 && y<=4 && x>=0 && x<=4){
				
					//idからHTML要素を取得する
					var element = document.getElementById(id);
					
					// divの中にあるimg要素を取得する
					var bg = element.style.backgroundImage;

					if(bg.includes("サマーカット.png")){
						element.style.backgroundImage = "url('長毛猫.png')";
							} else {
							element.style.backgroundImage = "url('サマーカット.png')";
						}
					}
				}
		</script>
	</body>
</html>
