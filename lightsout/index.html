<html>

<head>
	<meta charset="UTF-8">
	<meta name="robots" content="noindex">

	<style>
		:root {
			--cell-size: clamp(48px, calc((100vh - 260px) / 5 - 10px), 90px);
		}
		
		body {
			margin: 0;
			min-height: 100vh;

			background:
				radial-gradient(ellipse at 10% 5%,
					rgba(160, 85, 255, 0.45),
					transparent 45%),
				radial-gradient(ellipse at 90% 15%,
					rgba(80, 130, 255, 0.35),
					transparent 45%),
				radial-gradient(ellipse at 50% 100%,
					rgba(255, 80, 190, 0.3),
					transparent 50%),
				#171426;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: -1;

			background-image:
				radial-gradient(circle, #ffffff 1px, transparent 2px),
				radial-gradient(circle, #d9a6ff 1.5px, transparent 2.5px),
				radial-gradient(circle, #8deaff 1px, transparent 2px);

			background-size:
				130px 150px,
				210px 190px,
				170px 220px;

			background-position:
				20px 30px,
				80px 100px,
				40px 150px;

			opacity: 0.65;
		}



		.title {
			margin-top: 30px;
			text-align: center;
			font-size: 50px;
			font-weight: bold;
			letter-spacing: 5px;

			color: #ffffff;

			text-shadow:
				0 0 5px #ffffff,
				0 0 10px #ff6bcb,
				0 0 20px #ff6bcb,
				0 0 40px #b78aff;
		}

		.box {
			box-sizing: border-box;
			width: var(--cell-size);
			height: var(--cell-size);
			float: left;
			margin-left: 10px;
			margin-bottom: 10px;

			background-color: #FF6BCB;

			border-radius: 10px;
			box-shadow: 0 0 10px #FF6BCB;
			transition: 0.2s;

			border: 1px solid rgba(183, 138, 255, 0.35);
			cursor: pointer;
		}

		.buttons {
			display: flex;
			justify-content: center;
			gap: 25px;
			margin-top: 30px;
		}

		button {
			width: 150px;
			height: 50px;
			border-radius: 12px;
			font-size: 18px;
			font-weight: bold;
			letter-spacing: 2px;
			cursor: pointer;
			transition: 0.2s;
		}

		.start {
			background-color: #FF6BCB;
			color: white;
			border: none;
			box-shadow: 0 0 12px #FF6BCB;
		}

		.reset {
			background-color: #32264B;
			color: white;
			border: 1px solid #B78AFF;
			box-shadow: 0 0 10px rgba(183, 138, 255, 0.4);
		}

		button:hover {
			transform: translateY(-3px);
			filter: brightness(1.2);
		}

		.game-layout {
			display: grid;

			grid-template-columns: 240px calc((var(--cell-size) + 10px) * 5) 240px;

			gap: 30px;

			justify-content: center;
			align-items: start;

			width: 1040px;
			margin: 30px auto;
		}

		/* 左右のエリア */
		.howto,
		.status-area {
			width: 240px;
			box-sizing: border-box;
			min-height: 320px;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		/* 左：遊び方 */
		.howto {
			padding: 20px;
			background: rgba(50, 38, 75, 0.85);
			border: 1px solid #B78AFF;
			border-radius: 15px;
			box-shadow: 0 0 12px rgba(183, 138, 255, 0.4);
			color: white;
			transform: translateY(10px);
		}

		.howto h3 {
			color: #D9A6FF;
			text-align: center;
			letter-spacing: 3px;
		}

		/* 中央：ゲーム */
		.game-area {
			width: calc((var(--cell-size) + 10px) * 5);
		}

		.board {
			width: calc((var(--cell-size) + 10px) * 5);
			height: calc((var(--cell-size) + 10px) * 5);
			display: flow-root;
		}

		/* 右：タイマー */
		.status-area {
			display: flex;
			flex-direction: column;
			gap: 25px;
			transform: translateY(10px);
		}

		.status-box {
			box-sizing: border-box;
			padding: 20px;
			text-align: center;
			
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;

			background-color: rgba(50, 38, 75, 0.85);
			border: 1px solid #B78AFF;
			border-radius: 15px;

			box-shadow: 0 0 12px rgba(183, 138, 255, 0.4);
		}

		.status-box p {
			color: #D9A6FF;
			font-size: 16px;
			letter-spacing: 3px;
			margin-top:0px;
		}

		.status-box div {
			color: white;
			font-size: 28px;
			font-weight: bold;

			text-shadow: 0 0 10px #8DEAFF;
		}
	</style>

</head>

<body>
	<div class="title">
		Lights Out
	</div>

	<div class="game-layout">

		<!-- 左：遊び方 -->
		<div class="howto">
			<h3>HOW TO PLAY</h3>
			<p>① マスをクリックします。</p>
			<p>② クリックしたマスと上下左右のライトが反転します。</p>
			<p>③ すべてのライトを消すとクリア！</p>
		</div>

		<!-- 中央：ゲーム盤面 -->
		<div class="game-area">

			<div class="board">
				<div id="b00" class="box" onclick="reverse(0,0)"></div>
				<div id="b01" class="box" onclick="reverse(0,1)"></div>
				<div id="b02" class="box" onclick="reverse(0,2)"></div>
				<div id="b03" class="box" onclick="reverse(0,3)"></div>
				<div id="b04" class="box" onclick="reverse(0,4)"></div>
				<div id="b10" class="box" onclick="reverse(1,0)"></div>
				<div id="b11" class="box" onclick="reverse(1,1);"></div>
				<div id="b12" class="box" onclick="reverse(1,2)"></div>
				<div id="b13" class="box" onclick="reverse(1,3);"></div>
				<div id="b14" class="box" onclick="reverse(1,4)"></div>
				<div id="b20" class="box" onclick="reverse(2,0)"></div>
				<div id="b21" class="box" onclick="reverse(2,1)"></div>
				<div id="b22" class="box" onclick="reverse(2,2)"></div>
				<div id="b23" class="box" onclick="reverse(2,3)"></div>
				<div id="b24" class="box" onclick="reverse(2,4)"></div>
				<div id="b30" class="box" onclick="reverse(3,0)"></div>
				<div id="b31" class="box" onclick="reverse(3,1);"></div>
				<div id="b32" class="box" onclick="reverse(3,2)"></div>
				<div id="b33" class="box" onclick="reverse(3,3);"></div>
				<div id="b34" class="box" onclick="reverse(3,4)"></div>
				<div id="b40" class="box" onclick="reverse(4,0)"></div>
				<div id="b41" class="box" onclick="reverse(4,1)"></div>
				<div id="b42" class="box" onclick="reverse(4,2)"></div>
				<div id="b43" class="box" onclick="reverse(4,3)"></div>
				<div id="b44" class="box" onclick="reverse(4,4)"></div>
			</div>

			<div class="buttons">
				<button class="start" onclick="start();">START</button>
				<button class="reset" onclick="reset()">RESET</button>
			</div>
		</div>

		<!-- 右：タイマー -->
		<div class="status-area">

			<div class="status-box">
				<p>TIME</p>
				<div id="timer">00:00</div>
			</div>

			<div class="status-box">
				<p>BEST TIME</p>
				<div id="best">--:--</div>
			</div>

		</div>

	</div>

	<script>
		var t = 0;				//経過時間
		var timer = 0; 			//経過時間用タイマー
		var mode = "stop"		//ゲーム開始状態

		function start() {
			if (mode == "stop") {
				mode = "start"

				document.getElementById("timer").innerHTML = formatTime(t);
				timer = setInterval(showTime, 1000);

				function showTime() {
					t++;
					document.getElementById("timer").innerHTML = formatTime(t);
				}
			}
		}

		function formatTime(t) {
			var min = Math.floor(t / 60);
			var sec = t % 60;

			return String(min).padStart(2, "0") + ":" +
				String(sec).padStart(2, "0");
		}

		function reverse(y, x) {
			clk(y, x);     // クリックしたマス
			clk(y - 1, x);   // 上
			clk(y + 1, x);   // 下
			clk(y, x - 1);   // 左
			clk(y, x + 1);   // 右

			// すべてのライトが消えたか確認
			if (mode == "start" && checkClear()) {
				clearInterval(timer);  // タイマー停止
				mode = "stop";         // ゲームを停止状態にする
				alert("CLEAR！おめでとうございます！");
			}
		}

		function checkClear() {

			for (var y = 0; y <= 4; y++) {
				for (var x = 0; x <= 4; x++) {

					var id = "b" + y + x;
					var element = document.getElementById(id);

					// 1つでも光っているマスがあればfalse
					if (element.style.boxShadow != "none") {
						return false;
					}
				}
			}

			// 25マスすべて消えていたらtrue
			return true;
		}

		function clk(y, x) {
			var id = "b" + y + x;

			//yとxが０～４の場合のみ、background-colorを変更する
			if (y >= 0 && y <= 4 && x >= 0 && x <= 4) {

				//idからHTML要素を取得する
				var element = document.getElementById(id);

				// divの中にあるbackground-color要素を取得する
				var bg = getComputedStyle(element).backgroundColor;

				if (bg == "rgb(255, 107, 203)") {
					element.style.backgroundColor = "#32264B";
					element.style.boxShadow = "none";
				} else {
					element.style.backgroundColor = "#FF6BCB";
					element.style.boxShadow = "0 0 10px #FF6BCB";
				}
			}
		}

		function reset() {
			clearInterval(timer);  // タイマーを停止する
			timer = 0;             // タイマーIDを初期化する
			t = 0;                 // 経過時間を0秒に戻す
			mode = "stop";         // ゲームの状態を停止中に戻す

			document.getElementById("timer").innerHTML = formatTime(t);
		}

	</script>
</body>

</html>
