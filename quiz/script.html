	<body>
		<div style="width:650px; margin:0 auto;margin-top:20px;">
			<div style = "text-align:center;font-size:36px;font-weight:bold;color:#8b4513;">🐈ねこクイズ🐈</div>
			
			<br>
			
			<div id="mondai" class="question">問題</div>
			
			<br>
			
			<div id="sentaku1" class="left" onclick="clk(1)">選択肢1</div>
			<div id="sentaku2" class="right" onclick="clk(2)">選択肢2</div>
		
			<div style="clear:both;"></div>
		
			<div id="sentaku3" class="left"onclick="clk(3)">選択肢3</div>
			<div id="sentaku4" class="right"onclick="clk(4)">選択肢4</div>
		
			<div style="clear:both;"></div>
					
			<div id="kotae" class="answer"onclick="final()">回答</div>
			
		</div>
		
		<script>
			var finalanswer="0"
			var clickanswer="0"
			
			//配列が何行あるかを求める。
			var max = data.length;
			
			//０～２までの乱数を発生させる→ 変数 r にいれる
			var r = Math.floor(Math.random() * max);
			
			//data[r][0]に入っている文字を id="mondai" の要素に入れる
			document.getElementById("mondai").innerHTML = data[r][0];
			
			//data[r][1] に入っている文字を id="sentaku1" の要素に入れる
			document.getElementById("sentaku1").innerHTML = data[r][1];
			
			//data[r][2] に入っている文字を id="sentaku2" の要素に入れる
			document.getElementById("sentaku2").innerHTML = data[r][2];
			
			//data[r][3] に入っている文字を id="sentaku3" の要素に入れる
			document.getElementById("sentaku3").innerHTML = data[r][3];
			
			//data[r][4] に入っている文字を id="sentaku4" の要素に入れる
			document.getElementById("sentaku4").innerHTML = data[r][4];
			
			finalanswer=data[r][5];

			function clk(no) {
				//
				// 4つのdivを元の色に戻す
				document.getElementById("sentaku1").style.backgroundColor = "";
				document.getElementById("sentaku2").style.backgroundColor = "";
				document.getElementById("sentaku3").style.backgroundColor = "";
				document.getElementById("sentaku4").style.backgroundColor = "";

				//クリックされた要素のbackground-colorを#feeに変更する
				var id="sentaku" + no
				var element = document.getElementById(id);
				element.style.backgroundColor = "#f9b027";
				
				clickanswer=no;

			}
			
			function final(){
				if(clickanswer==0){
				return;
				}
				
				if(finalanswer==clickanswer){
					document.getElementById("mondai").innerHTML="正解！";
					}else{
					document.getElementById("mondai").innerHTML="残念！";
					}
			}
		</script>
		
	</body>
