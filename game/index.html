<html>

<head>
	<meta charset="UTF-8">

	<link rel="stylesheet" type="text/css" href="hover.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

	<style>
		.game-title {
			text-align: center;
			font-size: 4.6cqh !important;
			line-height: 1.2;
			margin-bottom: 2.8cqh;
		}

		.game-layout {
			display: grid;
			grid-template-columns: 11.5cqh 1fr 27cqh;
			gap: 1cqh;
			align-items: center;
		}

		.stamina-area {
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 2.3cqh;
			transform: translateX(10cqh);
		}

		#center {
			display: grid;
			grid-template-columns: repeat(8, 6.7cqh);
			gap: 0.6cqh;
			width: max-content;
			margin: 0 auto;
			justify-self: center;
			transform: translateX(6cqh);
		}

		.info-area {
			width: 27cqh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 8.8cqh;
		}

		.box {
			width: 6.7cqh;
			height: 6.7cqh;
			background-color: #000;
			color: #fff;
			font-size: 2.5cqh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.start-button {
			width: 23cqh;
			height: 8.5cqh;

			font-size: 2.3cqh;
			font-family: "Press Start 2P", system-ui;

			color: #fff;
			background-color: #000;
			border: 2px solid #000;

			cursor: pointer;
			transform: translateX(-1.8cqh);
		}

		.time-area {
			width: 100%;
			text-align: center;
		}

		.time-title {
			font-size: 2.7cqh;
			margin-bottom: 2.8cqh;
			transform: translateX(-1.8cqh);
		}


		.stamina {
			width: 90%;
			flex: 1;
			min-height: 0;
			background-color: #0f0;
			margin: 0;
		}

		.stamina-bar {
			width: 11.5cqh;
			height: 49cqh;
			border: 0.95cqh solid #000;
			box-sizing: border-box;
			padding: 0.6cqh 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.5cqh;

		}



		.charge {
			width: 11.5cqh;
			height: 6.7cqh;
			font-size: 2.3cqh;
			flex-shrink: 0;
			position: relative;
			margin: 0;
			background-color: #000;
		}

		.heart {
			width: 4cqh;
			height: 4cqh;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -40%);
		}

		.score {
			width: 100%;
			font-size: 1.9cqh;
			text-align: center;
			margin-top: 2.8cqh;
		}

		.time {
			width: 23cqh;
			height: 9.5cqh;
			font-size: 2.7cqh;
			border: 0.95cqh solid #000;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.score-area {
			width: 100%;
			text-align: center;
			transform: translateX(-1.8cqh);
		}

		.score-title {
			font-size: 2.7cqh;
			margin-bottom: 2.8cqh;

		}

		.score-list {
			width: 100%;
		}


		#gameover {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.6);
			display: none;
			z-index: 9999;
			text-align: center;
			padding-top: 200px;
		}

		.gameover-text {
			font-size: 60px;
			color: #fff;
			font-weight: bold;
		}

		#gameover button {
			width: 200px;
			height: 50px;
			font-size: 24px;
			margin-top: 30px;
			color: #fff;
			background-color: #000;

		}

		#clear {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.6);
			display: none;
			z-index: 10;
			text-align: center;
			padding-top: 200px;
		}

		.clear-text {
			font-size: 60px;
			font-weight: bold;
			background: linear-gradient(to right, #e60000, #f39800, #fff100, #009944, #0068b7, #1d2088, #920783, #e60000) 0 / 200%;
			height: 80px;
			animation: 5s rainbow infinite;
			background-clip: text;
			-webkit-background-clip: text;
			color: transparent;
		}

		@keyframes rainbow {
			100% {
				background-position: 200%;
			}
		}

		#clear button {
			width: 200px;
			height: 50px;
			font-size: 24px;
			margin-top: 30px;
			color: #fff;
			background-color: #000;
		}

		div {
			box-sizing: border-box;
		}

		body {
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: "Press Start 2P", system-ui;
			font-weight: 400;
			font-style: normal;
			background-color: #222;

		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
		}

		/* テレビ全体 */
		.tv-container {
			width: min(100vw, 154.6vh);
			aspect-ratio: 722 / 467;
			margin: auto;
			position: relative;
			background: url("retorotv.png") center center no-repeat;
			background-size: 100% 100%;

			image-rendering: pixelated;
			filter: contrast(150%) saturate(120%) sepia(20%);
		}

		.tv-container::after {
			content: "";
			position: absolute;
			inset: 0;
			background: repeating-linear-gradient(to bottom,
					rgba(0, 0, 0, 0.15) 0px,
					rgba(0, 0, 0, 0.15) 2px,
					transparent 2px,
					transparent 4px);
			pointer-events: none;
		}

		/* テレビ画面の中 */
		.game-screen {
			position: absolute;

			width: 64%;
			height: 85%;

			left: 10%;
			top: 19%;

			overflow: hidden;
			container-type: size;

		}

		button {
			font-family: "Press Start 2P", system-ui;
			font-weight: 400;
			font-style: normal;
		}
	</style>

</head>

		<script>
			var t = 0;				//経過時間
			var timer = 0; 			//経過時間用タイマー
			var timer2 = 0;			//スタミナ用タイマー
			var c = 0;

			var count = 0;			//クリックしたカード枚数
			var id1;				//1枚目のカードID
			var id2;				//2枚目のカードID
			var a;					//1枚目のカードの数字
			var b;					//2枚目のカードの数字

			var clearCount = 0;		//消えたカードの枚数
			var mode = "stop";		//ゲーム開始状態
			var flag = false;		//ペア判定中のクリック制御


			// ベストスコアを読み込む
			var scores = JSON.parse(localStorage.getItem("bestScores")) || [];	//ベストスコア

			function formatTime(time) {
				var min = Math.floor(time / 60);
				var sec = time - (min * 60);

				// 1桁の場合は先頭に0を追加する
				var mm = String(min).padStart(2, "0");
				var ss = String(sec).padStart(2, "0");

				return mm + ":" + ss;
			}



			//過去のベストスコアを表示
			displayScore();

			function start() {
				if (mode == "stop") {
					mode = "start"
					for (var i = 0; i < 64; i++) {   //for(初期値、いつまで続けるか、１周まわったらどうするか）
						// dataの最大配列数を求め、乱数を発生させる。
						var max = data.length;
						var r = Math.floor(Math.random() * max);

						// data[r※乱数]とdata[i]を入れ替える。
						var x = data[r];
						data[r] = data[i];
						data[i] = x;
					}

					for (i = 0; i < 64; i++) {
						// idの要素にdata[i]を上書きする。
						var id = "b" + i;
						document.getElementById(id).innerHTML = data[i];
					}



					//時間経過を表すタイマー表示
					timer = setInterval(showTime, 1000);

					function showTime() {
						t++;
						document.getElementById("timer").innerHTML = formatTime(t);
					}





					// スタミナバーを動かす
					timer2 = setInterval(show, 1000);

					function show() {

						if (c < 16) {
							c++;

							// スタミナを1つ消す
							var id = "c" + c;
							var element = document.getElementById(id);
							element.style.backgroundColor = "transparent";

							// 残っているスタミナの色を変更
							for (var i = c + 1; i <= 16; i++) {
								var id = "c" + i;
								var element = document.getElementById(id);

								if (c <= 5) {
									element.style.backgroundColor = "#00cc00"; // 緑
								}
								else if (c <= 10) {
									element.style.backgroundColor = "#FFC800"; // 黄色
								}
								else {
									element.style.backgroundColor = "#ff0000"; // 赤
								}
							}
						}

						// スタミナがすべてなくなったらGAME OVER
						if (c >= 16) {
							document.getElementById("gameover").style.display = "block";
							clearInterval(timer);
							clearInterval(timer2);
						}
					}

				}
			}





			//ペア同士をクリックしたら消えるようにする
			function clk(i) {
				// STARTボタンを押すまでカードをクリックできない
				if (mode == "stop") {
					return;
				}

				if (flag == true) {
					return;
				}

				// すでに消えたカードはクリックできない
				var checkId = "b" + i;
				var checkElement = document.getElementById(checkId);

				if (checkElement.innerHTML == "") {
					return;
				}

				count++;

				if (count == 1) {
					var id = "b" + i;
					var element = document.getElementById(id);
					element.style.backgroundColor = "#808080";

					id1 = id;
					a = document.getElementById(id).innerHTML;
				}

				else if (count == 2) {
					var id = "b" + i;

					//1枚目と同じカードなら処理を終了
					if (id1 == id) {
						count = 1;
						return;
					}

					flag = true;

					var element = document.getElementById(id);
					element.style.backgroundColor = "#808080";

					id2 = id;
					b = document.getElementById(id).innerHTML;

					if (a == b) {
						setTimeout(function () {
							document.getElementById(id1).innerHTML = "";
							document.getElementById(id2).innerHTML = "";

							document.getElementById(id1).style.backgroundColor = "transparent";
							document.getElementById(id2).style.backgroundColor = "transparent";


							//消えたカードの枚数をカウント
							clearCount = clearCount + 2;

							//64枚すべて消えたらクリア画面を表示
							if (clearCount == 64) {
								document.getElementById("clear").style.display = "block";

								//タイマーを停止
								clearInterval(timer);
								clearInterval(timer2);

								//ベストスコアを登録
								saveScore(t);
							}
							flag = false;
						}, 500);

					} else {
						setTimeout(function () {
							document.getElementById(id1).innerHTML = a;
							document.getElementById(id2).innerHTML = b;

							document.getElementById(id1).style.backgroundColor = "#000";
							document.getElementById(id2).style.backgroundColor = "#000";


							flag = false;
						}, 1000);
					}
					count = 0;
				}
			}



			//♡ボタンを押すと、スタミナバーがリセットされる
			function charge() {
				c = 0;
				for (var i = 1; i <= 16; i++) {
					var id = "c" + i;
					var element = document.getElementById(id);
					element.style.backgroundColor = "#00cc00";
				}

				// クリック中のカードを裏向きに戻す
				if (count == 1) {
					document.getElementById(id1).style.backgroundColor = "#000";
				}

				// クリック枚数をリセット
				count = 0;
			}


			// ベストスコアを表示する
			function displayScore() {
				document.getElementById("s1").innerHTML = scores[0] !== undefined ? formatTime(scores[0]) : "--:--";
				document.getElementById("s2").innerHTML = scores[1] !== undefined ? formatTime(scores[1]) : "--:--";
				document.getElementById("s3").innerHTML = scores[2] !== undefined ? formatTime(scores[2]) : "--:--";
			}

			// 新しいスコアを登録する
			function saveScore(time) {

				// 新しいタイムを追加
				scores.push(time);

				// タイムの速い順に並べ替える
				scores.sort(function (a, b) {
					return a - b;
				});

				// 上位3件だけ残す
				scores = scores.slice(0, 3);

				// localStorageに保存
				localStorage.setItem("bestScores", JSON.stringify(scores));

				// 画面を更新
				displayScore();
			}
		</script>
