		<script>
			var t = 0;				//経過時間
			var timer = 0; 			//経過時間用タイマー
			var timer2 = 0;			//スタミナ用タイマー
			var c=0;
			
			var count = 0;			//クリックしたカード枚数
			var id1;				//1枚目のカードID
			var id2;				//2枚目のカードID
			var a;					//1枚目のカードの数字
			var b;					//2枚目のカードの数字
			
			var clearCount = 0;		//消えたカードの枚数
			var mode="stop";		//ゲーム開始状態
			var flag = false;		//ペア判定中のクリック制御
			
			
			// ベストスコアを読み込む
			var scores = JSON.parse(localStorage.getItem("bestScores")) || [];	//ベストスコア
			
			function formatTime(time){
				var min = Math.floor(time/60);
				var sec = time-(min*60);

				// 1桁の場合は先頭に0を追加する
				var mm = String(min).padStart(2,"0");
				var ss = String(sec).padStart(2,"0");
				
				return mm + ":" + ss;
			}
					
					
					
			//過去のベストスコアを表示
			displayScore();
			
			function start(){
				if (mode=="stop"){
					mode="start"
					for(var i=0; i<64; i++){   //for(初期値、いつまで続けるか、１周まわったらどうするか）
						// dataの最大配列数を求め、乱数を発生させる。
						var max = data.length;
						var r = Math.floor(Math.random() * max);
						
						// data[r※乱数]とdata[i]を入れ替える。
						var x=data[r];
						data[r]=data[i];
						data[i]=x;
					}
					
					for(i=0; i<64; i++){
						// idの要素にdata[i]を上書きする。
						var id="b"+i;
						document.getElementById(id).innerHTML = data[i];
					}
					
					
					
					//時間経過を表すタイマー表示
					timer = setInterval(showTime,1000);
					
					function showTime(){
						t++;
						document.getElementById("timer").innerHTML = formatTime(t);
					}
					
					
					
					//スタミナバーを動かす
					timer2 = setInterval(show, 1000);
					function show(){ 
						
						if(c<=15){
							if(c>=0){
								c++;
								var id = "c" + c;
								var element = document.getElementById(id);
								element.style.backgroundColor = "transparent";
							}
						}
							else{
								if(c==16){
									document.getElementById("gameover").style.display = "block";
									clearInterval(timer);
									clearInterval(timer2);
								}
							}
						}
					}
				}
			
			
			
			
			//ペア同士をクリックしたら消えるようにする
			function clk(i){
				if(flag==true){
					return;
				}
				
				count++;
				
				if(count==1){
					var id="b"+i;
					var element = document.getElementById(id);
					element.style.backgroundColor = "#f00";
					
					id1=id;
					a=document.getElementById(id).innerHTML;
				}
				
				else if(count==2){
					var id="b"+i;
					
					 //1枚目と同じカードなら処理を終了
					if(id1==id){
						count=1;
						return;
					}
					
					flag=true;
					
					var element = document.getElementById(id);
					element.style.backgroundColor = "#f00";
					
					id2=id;
					b=document.getElementById(id).innerHTML;
					
					if(a==b){
						setTimeout(function(){
							document.getElementById(id1).innerHTML = "";
							document.getElementById(id2).innerHTML = "";
						
							document.getElementById(id1).style.backgroundColor = "transparent";
							document.getElementById(id2).style.backgroundColor = "transparent";

							
							//消えたカードの枚数をカウント
							clearCount = clearCount + 2;
							
							 //64枚すべて消えたらクリア画面を表示
							if(clearCount == 64){
								document.getElementById("clear").style.display = "block";
								
								//タイマーを停止
								clearInterval(timer);
								clearInterval(timer2);
								
								//ベストスコアを登録
								saveScore(t);
							}
							flag=false;
						},500);
						
					}else{
						setTimeout(function(){
							document.getElementById(id1).innerHTML = a;
							document.getElementById(id2).innerHTML = b;
							
							document.getElementById(id1).style.backgroundColor = "#000";
							document.getElementById(id2).style.backgroundColor = "#000";
							
							
							flag=false;
						},1000);
					}
					count=0;
				}
			}
			
			
			
			//♡ボタンを押すと、スタミナバーがリセットされる
			function charge(){
				c=0;
				for(var i=1; i<=16; i++){
				var id="c"+i;
				var element = document.getElementById(id);
				element.style.backgroundColor = "#f00";
				}
			}
			
			
			// ベストスコアを表示する
			function displayScore(){
				document.getElementById("s1").innerHTML = scores[0] !== undefined ? formatTime(scores[0]) : "00:00";
				document.getElementById("s2").innerHTML = scores[1] !== undefined ? formatTime(scores[1]) : "00:00";
				document.getElementById("s3").innerHTML = scores[2] !== undefined ? formatTime(scores[2]) : "00:00";
			}
			
			// 新しいスコアを登録する
			function saveScore(time){

				// 新しいタイムを追加
				scores.push(time);

				// タイムの速い順に並べ替える
				scores.sort(function(a, b){
					return a - b;
				});

				// 上位3件だけ残す
				scores = scores.slice(0, 3);

				// localStorageに保存
				localStorage.setItem("bestScores", JSON.stringify(scores));

				// 画面を更新
				displayScore();
			}
		</script>
